[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrace-logs"
version = "0.1.0"
description = "Inspect and replay structured multi-agent logs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["logs", "replay", "visualization", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "jmespath",
    "pyyaml",
    "platformdirs",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "build",
]

[project.scripts]
retrace-logs = "retrace.cli.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrace = ["adapters/builtin/*.yaml", "ui/*.html", "ui/*.js", "ui/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "slow: tests that build and install into an isolated environment",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reference-logs"]
