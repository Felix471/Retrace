# Status: works today
# Scalar trajectory entries use the content fallback and carry no agent or role.
# Keep other_data.patch, but exclude the large hints_text prose from metadata.
retrace_mapping: 1
run_discovery:
  pattern: HyperAgent/*.json
  unit: json
run:
  id: instance_id
  metadata:
    instance_id: instance_id
    patch: other_data.patch
event:
  sources:
    - name: trajectory
      path: trajectory
      type: other
      repairs:
        - field: turn
          strategy: ordinal
          base: 0
sniff:
  required_fields:
    - instance_id
    - problem_statement
    - other_data
    - trajectory
    - note
