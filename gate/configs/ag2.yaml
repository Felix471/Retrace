# Status: works today
retrace_mapping: 1
run_discovery:
  pattern: AG2/*.json
  unit: json
run:
  id: instance_id
  metadata:
    instance_id: instance_id
    correct: other_data.correct
    perturbation_type: other_data.perturbation_type
event:
  sources:
    - name: trajectory
      path: trajectory
      type: message
      fields:
        agent_id: name
        role: role
        content: "join('\n', content)"
        metadata: rest
      repairs:
        - field: turn
          strategy: ordinal
          base: 0
sniff:
  required_fields:
    - instance_id
    - problem_statement
    - other_data
    - trajectory
    - note
