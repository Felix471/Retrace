name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Check core purity
        run: python scripts/check_core_purity.py

      - name: README quickstart smoke
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install .
          retrace-logs check demo/
          retrace-logs view demo/ --no-browser --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/api/experiment > /tmp/experiment.json && break
            sleep 1
          done
          python -c "import json; data=json.load(open('/tmp/experiment.json')); assert data['run_count'] == 40"
