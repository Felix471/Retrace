retrace_mapping: 1
run_discovery:
  pattern: support-demo-*
  unit: dir
  events_file: events.jsonl
run:
  id: "{dir_name}"
  manifest: meta.json
  metadata:
    issue_area: issue_area
    model_name: model_name
    routing_variant: routing_variant
  outcome: outcome
event:
  turn: sequence
  timestamp: occurred_at
  agent_id: handler
  type:
    from: step_kind
    map:
      message: message
      tool_call: tool_call
      tool_result: tool_result
    default: other
  phase: workflow_stage
  content: body
  tokens_in: tokens_in
  tokens_out: tokens_out
  cost: cost
  metadata: rest
