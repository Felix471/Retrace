# Promoted from the MAST release gate on 2026-08-21; content via join('\n', content); note excluded for annotation-leakage reasons; sniff uses 100%-coverage top-level keys.
retrace_mapping: 1
run_discovery:
  pattern: "*.json"
  unit: json
run:
  id: instance_id
  metadata:
    instance_id: instance_id
    correct: other_data.correct
    perturbation_type: other_data.perturbation_type
event:
  sources:
    - name: trajectory
      path: trajectory
      type: message
      fields:
        agent_id: name
        role: role
        content: "join('\n', content)"
        metadata: rest
      repairs:
        - field: turn
          strategy: ordinal
          base: 0
sniff:
  required_fields:
    - instance_id
    - trajectory
    - other_data
